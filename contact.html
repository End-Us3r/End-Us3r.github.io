          <li class="first-element">
            <input class="nav-fallback" type="checkbox" id="nav-fallback" tabindex="-1" aria-hidden="true">
            <label for="nav-fallback" id="toggleDropdown" tabindex="0">JA</label>
            <ul class="mobile-dropdown">
              <li><a href="index.html">Root</a></li>

    <script>
      document.getElementById("toggleDropdown").addEventListener("click", function (e) {
        e.preventDefault();
        const dropdown = this.nextElementSibling;
        const open = dropdown.style.display === "flex";
        dropdown.style.display = open ? "none" : "flex";
        const box = document.getElementById("nav-fallback");
        if (box) box.checked = !open;
      });
      document.getElementById("toggleDropdown").addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          this.click();
        }
      });
    </script>
    <main id="main" class="contact-main" tabindex="-1">
      <h1>Contact</h1>
      <section class="neo-cyber-form" id="third-page">
        <div class="form-overlay"></div>
        <div class="form-container">
          <h2 class="glow-title">[::] Initiate Contact<span class="cursor visible">_</span></h2>
          <form action="javascript:void(0)" method="POST" onsubmit="alert('Form submission disabled for demo purposes.');" aria-describedby="contact-demo-note">
            <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off" aria-hidden="true">

            <input type="hidden" name="_subject" value="New submission!" />

            <input type="hidden" name="_redirect" value="https://end-us3r.github.io/End-Us3r.github.io/" />

            <label for="name">> Name:</label>
            <input type="text" name="name" id="name" autocomplete="name" required />

            <label for="email">> Email:</label>
            <input type="email" name="email" id="email" autocomplete="email" required />

            <label for="message">> Message:</label>
            <textarea name="message" id="message" rows="5" required minlength="10"></textarea>

            <p id="contact-demo-note">[For demo purposes only, no user data collected]</p>

            <button type="submit">> Transmit</button>
          </form>
        </div>
      </section>
    </main>
